name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Layer-1 secret-value invariant gate (.luacheckrc). Fails the release if a
      # raw UnitGUID/UnitName/UnitIsUnit/InCombatLockdown call is added outside
      # secrets.lua (luacheck code 113 = undefined global, because those six APIs
      # are deliberately omitted from read_globals). --only 113 also surfaces
      # syntax errors and undefined-global typos but ignores cosmetic warnings, so
      # the gate stays focused on exactly the class of bug that caused the Slave
      # Pens secret-value crash in v1.5.0.
      - name: Secret-value invariant (luacheck)
        uses: nebularg/actions-luacheck@v1
        with:
          files: .
          args: --only 113
          annotate: warning

      # Layer-1b secret-MIXIN invariant. luacheck can't flag method calls (it
      # doesn't know the receiver's type), so this grep gate fails the release if
      # a raw secret-touching foreign-mixin call (e.g. frame:GetNameText(), which
      # internally compares the secret sourceDisplayType) is added outside its
      # pcall-wrapping safe helper. This is the class that caused the v1.5.2
      # Sporefall/Val taint-crash.
      - name: Secret-mixin invariant (taint guard)
        run: bash tools/lint-secret-mixin.sh

      # Layer-2 package-contents invariant. The two gates above protect the user
      # from crashes; this one protects them from the download. v1.5.5 shipped
      # 217 KB of internal review documents because nobody added them to the
      # ignore list — 38 % of the zip. An allowlist cannot be forgotten the way a
      # denylist can: anything that is not addon content fails the release until
      # it is moved under docs/ or deliberately declared.
      - name: Package-contents invariant (no internal files in the zip)
        run: bash tools/lint-package-contents.sh

      - uses: BigWigsMods/packager@v2
        with:
          args: -p 1501917 -n "{package-name}-{project-version}{nolib}{classic}:{package-name}-{project-version}{nolib}{classic}"
